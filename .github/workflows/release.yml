name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python main_bundled.py --build

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/daily-tasks.exe").Hash.ToLower()
          "$hash  daily-tasks.exe" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-windows
          path: |
            dist/daily-tasks.exe
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/daily-tasks.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
